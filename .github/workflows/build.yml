name: Build DownloadFix
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore/**'
      - 'build.ps1'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Build from public source without embedded credentials
        shell: pwsh
        run: ./build.ps1 -Configuration Release
      - name: Verify runtime configuration and request headers
        shell: pwsh
        run: ./tests/run-smoke-tests.ps1
      - name: Prepare portable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item 'Plain Craft Launcher 2/bin/Plain Craft Launcher 2.exe' package/
          Copy-Item 'Plain Craft Launcher 2/bin/Plain Craft Launcher 2.exe.config' package/
          Copy-Item PCL.Services.example.json package/PCL.Services.json
          Copy-Item PCL.Link.example.json package/PCL.Link.json
          Copy-Item LICENCE package/
      - uses: actions/upload-artifact@v7
        with:
          name: PCL-DownloadFix
          path: package/
